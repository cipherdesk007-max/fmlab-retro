name: pulizia
# Una volta sola: toglie il ramo "apt" (l'archivio Debian non c'è più).
on:
  push:
    branches: [main]
    paths: [".github/workflows/pulizia.yml"]
permissions:
  contents: write
jobs:
  togli-apt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push origin --delete apt || echo "ramo apt già tolto"
