name: prove

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  strumenti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintassi
        run: bash -n misura/misura.sh && bash -n core/costruisci-core-ios.sh
      - name: Dati del Game Emulator (dati/emulatore.json)
        run: |
          python3 - <<'PY'
          import json, re
          d = json.load(open("dati/emulatore.json"))
          assert d["schema"] == 1 and re.fullmatch(r"\d{4}\.\d\d\.\d\d-\d+", d["versione"]), "schema o versione"
          noti = {"fceumm", "gambatte", "bsnes", "pcsx_rearmed", "mgba", "desmume"}
          assert set(d["core"]) <= noti, "core sconosciuto"
          for n, c in d["core"].items():
              assert c["estensioni"] and all(re.fullmatch(r"[a-z0-9]{1,5}", e) for e in c["estensioni"]), n
              assert all(isinstance(k, str) and isinstance(v, str) and k.replace("_", "").isalnum() for k, v in c["opzioni"].items()), n
              for campo in ("nome", "nota"):
                  assert campo not in c or (isinstance(c[campo], dict) and all(isinstance(v, str) for v in c[campo].values())), (n, campo)
          assert "novita" not in d or all(isinstance(v, str) for v in d["novita"].values()), "novita"
          assert "urgente" not in d or isinstance(d["urgente"], bool), "urgente deve essere true/false"
          for b in d["bios"]:
              assert b["core"] in noti and re.fullmatch(r"[0-9a-f]{32}", b["md5"]) and "/" not in b["file"], b
          print("ok:", d["versione"], len(d["core"]), "core,", len(d["bios"]), "BIOS")
          PY

  # Riferimento: stessa misura su un vero server ARM64 con Debian 13 (senza interprete) = velocità "nativa".
  # Sul telefono si rifà la stessa misura: il rapporto dice quanto costa l'interprete (o il JIT).
  misura-arm64:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Programmi
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends xvfb xauth ca-certificates curl python3 unzip >/dev/null
      - name: Misura (finestra 1x e schermo intero, Xvfb software)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: set -o pipefail; xvfb-run -a -s "-screen 0 1308x644x24" bash misura/misura.sh 2>&1 | tee misura-arm64.txt
      - name: Core libretro disponibili in Debian 13 ARM64
        if: always()
        run: apt-cache search --names-only '^libretro-' | sort
      - name: Errori di RetroArch (se ci sono)
        if: always()
        run: cat "${XDG_CACHE_HOME:-$HOME/.cache}/fmlab-retro/errori.log" 2>/dev/null | head -60 || true
      - uses: actions/upload-artifact@v4
        with:
          name: misura-arm64
          path: misura-arm64.txt
