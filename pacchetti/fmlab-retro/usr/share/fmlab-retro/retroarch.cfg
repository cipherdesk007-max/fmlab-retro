# FMLAB Retro: impostazioni di partenza per l'iPhone (le cambi da RetroArch e restano tue).
# Per tornare a queste: fmlab-retro --ripristina
video_driver = "gl"
video_fullscreen = "false"
video_windowed_fullscreen = "false"
video_scale = "2.000000"
video_smooth = "false"
video_vsync = "true"
video_threaded = "true"
audio_driver = "pulse"
audio_latency = "128"
menu_driver = "rgui"
pause_nonactive = "false"
config_save_on_exit = "true"
notification_show_autoconfig = "false"
playlist_directory = "@HOME@/.config/retroarch/playlists"
system_directory = "@HOME@/.config/retroarch/system"
rgui_browser_directory = "@HOME@/Giochi"
savefile_directory = "@HOME@/Giochi/salvataggi"
savestate_directory = "@HOME@/Giochi/salvataggi"
libretro_directory = "/usr/lib/aarch64-linux-gnu/libretro"
libretro_info_path = "/usr/share/libretro/info"
